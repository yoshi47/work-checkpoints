version: 2

updates:
  # minor/patch は1本の PR にまとめ、major は個別に届かせる。
  # cooldown は公開直後のバージョンを避ける待ち時間で、security updates には
  # 適用されない（脆弱性アラートが出ればその場で PR が来る）。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
